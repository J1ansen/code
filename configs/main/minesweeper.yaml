experiment:
  name: main_validation_minesweeper
  seed: 12345
  runs: 1
  trials_per_seed: 10
  source_dataset: Cora
  target_dataset: Minesweeper
  prompt_variant: p24_prompt_edge_denoising
  trial_seed_mode: stream
  ablation: none
  seeds:
  - 12345
data:
  root: datasets
  download_if_missing: false
  normalize_features: false
  shots: 5
  homophily_shots: 5
  auto_shot_by_dataset: true
  heterophily_shot_ratio: 0.1
  gp2f_test_ratio: 0.9
  heterophily_datasets:
  - Actor
  - Squirrel
  - Chameleon
  - Minesweeper
  - amazon_ratings
  - AmazonRatings
  - Amazon-Ratings
  val_per_class: 30
pretrained:
  checkpoint_path: checkpoints/cora_grace.pt
  freeze_backbone: true
  auto_pretrain: true
  pretraining_config_path: pretrain_GNN/cora_grace.yaml
model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 32
  dropout: 0.0
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0
prompt_graph:
  enabled: true
  module_type: p24_prompt_edge_denoising_adapter
  static_graph: true
  feature_tokenizer:
    mode: binary_nonzero
    binary_threshold: 0.0
    binary_topk: 0
  feature_filter:
    min_df_global: 2
    max_df_global_ratio: 1.0
    min_label_count: 2
    min_purity: 0.0
    max_entropy: 1.0
    max_feature_nodes: 7
  feature_edge_weight: 1.0
  feature_edge_min_scale: 0.05
  feature_gate_floor: 0.2
  original_edge_weight: 1.0
  learn_feature_edge_weight: true
  use_feature_gate: true
  anti_hub_power: 0.75
  label_node_weight: 5.0
  unlabeled_node_weight: 0.2
  offclass_label_weight: 0.02
  detach_feature_prompt: true
  edge_scale_warmup_epochs: 0
  edge_scale_warmup_start: 1.0
  lambda_edge_l1: 0.0
  lambda_prompt_balance: 0.0
  lambda_p23_feature_harm: 0.05
  lambda_p23_feature_gate_supervision: 0.0
  p23_feature_harm_margin: 0.02
  p23_feature_harm_temperature: 0.15
  p23_feature_harm_quantile: 0.7
  p23_feature_help_quantile: 0.7
  p23_feature_min_signal: 0.005
  p23_feature_help_weight: 0.25
  p23_feature_harm_warmup_epochs: 5
  p23_feature_harm_detach_delta: true
  p23_feature_harm_class_balanced: true
  lambda_prompt_usage_consistency: 0.0
  lambda_prompt_view_entropy: 0.0
  lambda_class_route: 0.0
  lambda_key_proto: 0.0
  use_node_feature_edge_gate: true
  node_feature_edge_gate_strength: 0.25
  static_pool:
    enabled: false
    mode: hard
    strategy: feature_label_ambiguity
    ratio: 0.15
    core_ratio: 0.15
    expand_ratio: 0.35
    core_scale: 1.2
    expand_scale: 1.1
    non_pool_scale: 1.0
    apply_to: prompt_to_node
    feature_topk: 16
  prompt_residual:
    enabled: false
    rank: 4
    hidden_dim: 32
    dropout: 0.1
    gate_init_bias: -3.5
    max_delta_ratio: 0.05
    delta_scale: 1.0
    basis_init_std: 0.01
    use_reliability_prior: true
    reliability_prior_strength: 1.0
  lambda_p23_prompt_residual_delta_norm: 0.0
  lambda_p23_prompt_residual_delta_align: 0.0
  lambda_p23_prompt_residual_gate_budget: 0.0
  prompt_edge_denoising:
    enabled: true
    architecture: legacy_gate
    descriptor_type: representation_concat
    projection_dim: 16
    hidden_dim: 16
    dropout: 0.1
    gate_init: 1.0
    gate_floor: 0.7
    gate_cap: 1.1
    fusion: bootstrapped
    mix_ratio_init: 0.0
    mix_ratio_max: 0.2
    mix_warmup_epochs: 50
    apply_to: prompt_to_node
    allow_new_edges: false
    detach_node_repr: true
    detach_prompt_repr: true
  lambda_p24_keep_static: 0.0
  lambda_p24_hub_suppression: 0.0
  lambda_p24_prompt_homophily: 0.0
  lambda_p24_edge_budget: 0.0
  lambda_p24_candidate_cls: 0.0
  lambda_p24_candidate_anti_harm: 0.0
  lambda_p24_relation_prior: 0.0
  lambda_p24_relation_preservation: 0.0
  lambda_p24_relation_homophily_collapse: 0.0
  lambda_p24_relation_uncertain_keep: 0.0
  p24_candidate_anti_harm_margin: 0.001
  lambda_p24_route_utility: 0.0
  p24_route_utility_warmup_epochs: 0
  p24_route_positive_margin: 0.005
  p24_route_negative_margin: 0.005
  p24_route_class_balanced: true
  p24_route_supervise_no_prompt: true
  p24_route_target_mode: hard
  p24_route_gain_scale: 0.01
  p24_class_coverage_guard:
    enabled: false
    temperature: 1.0
    min_entropy_ratio: 0.75
    max_dominant_ratio: 0.7
    class_separation_weight: 1.0
    marginal_balance_weight: 0.25
    warmup_epochs: 0
    loss_mask: all_train
  lambda_p24_class_coverage_guard: 0.0
prompt_aware:
  enabled: false
prompt_adapter:
  enabled: false
training:
  epochs: 500
  lr: 0.001
  prompt_lr: 0.001
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 5
  eval_every: 1
  output_dir: outputs/main_validation/minesweeper
  early_stop_patience: 20
  early_stop_min_epochs: 0
  early_stop_metric: val_macro_f1
  keep_best_checkpoint: true
  class_balanced_ce: true
  class_weight_mode: inverse_sqrt
  freeze_base_model: false
  freeze_input_aligner_for_p23: false
  train_prompt_graph_module: true
  train_prompt_adapter: false
  train_prompt_aware_module: false
  base_checkpoint_path: null
  base_checkpoint_root: null
  load_prompt_from_base_checkpoint: false
  enable_test_label_cheat: false
  test_label_cheat_fraction: 0.1
  p24_collapse_recovery:
    train_input_aligner: false
    train_adapters: false
    train_fusion_alpha: false
release:
  protocol: validation_selected_v1
  selection_metric: val_macro_f1
  report_selection: best
  report_metric: test_macro_f1
  historical_results: results/main
  requires_rerun: true
